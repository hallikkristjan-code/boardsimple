<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Louend</title>
<link rel="icon" type="image/png" sizes="256x256" href="/app/icon.png">
<link rel="icon" type="image/svg+xml" href="/app/icon.svg">
<link rel="stylesheet" href="/app/style.css">
</head>
<body class="tool-kasi">
  <header id="top">
    <strong id="project">…</strong>
    <span id="count" class="muted"></span>
    <span class="grow"></span>
    <button id="fit" type="button">Mahuta kõik</button>
    <span id="zoom" class="pill">100%</span>
  </header>
  <nav id="tools" aria-label="Tööriistad">
    <button type="button" data-tool="vali" title="Vali — klõpsa ja keri ekraani sees (V)" aria-label="Vali">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3l14 8-6 1.5L10 19z"/></svg>
    </button>
    <button type="button" data-tool="kasi" title="Käsi — nihuta lõuendit (H, või hoia tühikut)" aria-label="Käsi">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 13V5.5a1.5 1.5 0 013 0V12m0-7.5a1.5 1.5 0 013 0V12m0-6a1.5 1.5 0 013 0V15a6 6 0 01-6 6h-1a6 6 0 01-5-2.7L3.5 14a1.5 1.5 0 012.5-1.6L8 15"/></svg>
    </button>
    <button type="button" data-tool="ring" title="Ring — märgi, mida muuta (O)" aria-label="Ring">
      <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="12" rx="8.5" ry="6.5"/></svg>
    </button>
  </nav>
  <main id="viewport">
    <div id="world">
      <div id="boards"></div>
      <svg id="overlay" width="1" height="1"></svg>
    </div>
    <p id="empty" hidden>Ekraane pole. Kirjuta HTML-failid kausta <code>screens/</code> (nt <code>screens/suunad/a.html</code>).</p>
  </main>
  <aside id="panel" aria-label="Märkused"></aside>
  <script type="module" src="/app/canvas.js"></script>
  <script type="module" src="/app/annotate.js"></script>
</body>
</html>
