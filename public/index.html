<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Louend</title>
<link rel="icon" type="image/png" sizes="256x256" href="/app/icon.png">
<link rel="icon" type="image/svg+xml" href="/app/icon.svg">
<link rel="stylesheet" href="/app/style.css">
</head>
<body class="tool-kasi">
  <header id="top">
    <div id="title" class="island">
      <strong id="project">…</strong>
      <span id="count"></span>
    </div>
    <span id="conn" role="status" hidden></span>
    <div id="view" class="island">
      <button id="fit" type="button">Mahuta kõik</button>
      <span id="zoom">100%</span>
    </div>
  </header>
  <nav id="tools" class="island" aria-label="Tööriistad">
    <button type="button" data-tool="vali" title="Vali — klõpsa ja keri ekraani sees (V)" aria-label="Vali">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3l14 8-6 1.5L10 19z"/></svg>
    </button>
    <button type="button" data-tool="kasi" title="Käsi — nihuta lõuendit (H, või hoia tühikut)" aria-label="Käsi">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 13V5.5a1.5 1.5 0 013 0V12m0-7.5a1.5 1.5 0 013 0V12m0-6a1.5 1.5 0 013 0V15a6 6 0 01-6 6h-1a6 6 0 01-5-2.7L3.5 14a1.5 1.5 0 012.5-1.6L8 15"/></svg>
    </button>
    <button type="button" data-tool="ring" title="Ring — märgi, mida muuta (O)" aria-label="Ring">
      <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="12" rx="8.5" ry="6.5"/></svg>
    </button>
    <button type="button" data-tool="kast" title="Kast — too blokk täpselt esile (B)" aria-label="Kast">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="16" height="12" rx="1"/></svg>
    </button>
    <button type="button" data-tool="joon" title="Joon — tõmba koha ümber või alla (P)" aria-label="Joon">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 16c3-9 6-9 8-4s5 5 8-4"/></svg>
    </button>
    <button type="button" data-tool="nool" title="Nool — osuta kohale (A)" aria-label="Nool">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19L19 5M10 5h9v9"/></svg>
    </button>
    <div id="colors" role="group" aria-label="Märgi värv">
      <button type="button" data-color="#d9412b" style="--c:#d9412b" title="Punane" aria-label="Punane"></button>
      <button type="button" data-color="#c9741f" style="--c:#c9741f" title="Oranž" aria-label="Oranž"></button>
      <button type="button" data-color="#2f8f5b" style="--c:#2f8f5b" title="Roheline" aria-label="Roheline"></button>
      <button type="button" data-color="#2f6fc4" style="--c:#2f6fc4" title="Sinine" aria-label="Sinine"></button>
      <button type="button" data-color="#7a55c7" style="--c:#7a55c7" title="Lilla" aria-label="Lilla"></button>
    </div>
  </nav>
  <main id="viewport">
    <div id="world">
      <div id="boards"></div>
      <svg id="overlay" width="1" height="1"></svg>
    </div>
    <p id="empty" hidden>Ekraane pole. Kirjuta HTML-failid kausta <code>screens/</code> (nt <code>screens/suunad/a.html</code>).</p>
  </main>
  <aside id="panel" class="island" aria-label="Märkused"></aside>
  <script type="module" src="/app/canvas.js"></script>
  <script type="module" src="/app/annotate.js"></script>
</body>
</html>
