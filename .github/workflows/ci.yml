name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm test
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python -I test/e2e/e2e.py
      - run: python -I test/e2e/marks.py
      - run: python -I test/e2e/agents.py
      - run: python -I test/e2e/a11y.py
      - run: python -I test/e2e/touch.py
      - run: python -I test/e2e/window.py
      - run: python -I test/e2e/load.py
